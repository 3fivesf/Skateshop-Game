<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Atlas Shift: a pixel art skate shop retail game set at Atlas Skateboarding in San Mateo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2315171c'/%3E%3Crect x='6' y='2' width='4' height='12' rx='2' fill='%2300aeef'/%3E%3Crect x='5' y='4' width='6' height='1' fill='%23f1ede4'/%3E%3Crect x='5' y='11' width='6' height='1' fill='%23f1ede4'/%3E%3C/svg%3E">
<title>Atlas Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}
</style>
<style>
/* Layout: one centered column — score strip, the shop screen, what you're holding, then the controller */
:root{
  color-scheme: dark;
  --bg:#15171c;
  --panel:#20242c;
  --line:#343a45;
  --ink:#f1ede4;
  --dim:#9aa1ad;
  --accent:#00aeef;
  --gold:#f2c14e;
  --bad:#ec5b52;
  --good:#4fc47f;
  --pix:'Press Start 2P', ui-monospace, Menlo, monospace;
  --ui:'Silkscreen', ui-monospace, Menlo, monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:720px;height:100%;margin:0 auto;padding-block:6px 8px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.wrap>*{flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .saves{display:flex;gap:6px}
h1{font-family:var(--pix);font-size:15px;margin:0;letter-spacing:.06em;font-weight:400}
h1 span{color:var(--accent)}
.sub{margin:0;color:var(--dim);font-size:12px;letter-spacing:.04em}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.hud div{background:var(--panel);border:2px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl{font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.hud b{font-family:var(--pix);font-size:10px;overflow:hidden;text-overflow:ellipsis;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
#rating{color:var(--gold)}
.sv{all:unset;cursor:pointer;text-align:center;font-family:var(--pix);font-size:9px;padding:7px 9px;background:var(--panel);border:2px solid var(--line);color:var(--ink)}
.sv:hover{border-color:var(--dim)}
.sv.on{border-color:var(--accent);color:var(--accent)}
.sv.off{color:var(--dim);text-decoration:line-through}
.sv:active{background:#2c313b}
.sv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go.alt{background:var(--panel);color:var(--ink)}
.levels{display:flex;flex-direction:column;gap:6px;width:min(100%,330px)}
.lv{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;align-items:baseline;text-align:left;padding:6px 10px;background:var(--panel);border:2px solid var(--ink)}
.lv b{font-family:var(--pix);font-weight:400;font-size:10px;color:var(--accent);grid-row:span 2}
.lv span{font-size:13px}
.lv small{font-size:11px;color:var(--dim);line-height:1.25}
.lv[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.lv:not([disabled]):hover{background:#2c313b}
.lv:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tray .wide{grid-column:1/-1}
.stock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 10px}
.st{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:10px;min-width:0}
.segs{display:flex;gap:2px}
.segs{gap:1px}
.segs i{width:4px;height:7px;background:#3a404c}
.segs i.on{background:var(--good)}
.st.low .segs i.on{background:var(--gold)}
.st.out{color:var(--bad)}
.chip.boxc{background:#5e3d24;border-color:#c08b55}
.screen{position:relative;width:min(100%,560px);aspect-ratio:1/1;margin:0 auto;box-sizing:border-box;background:#000;border:3px solid var(--ink);box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--line);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hint{position:absolute;bottom:6px;right:6px;font-family:var(--pix);font-size:9px;background:rgba(10,11,14,.82);color:var(--ink);padding:5px 7px;border:2px solid var(--ink)}
.hint:empty{display:none}
.toast{position:absolute;top:calc(8.4% + 4px);left:6px;max-width:62%;font-size:13px;background:rgba(10,11,14,.88);padding:5px 8px;border-left:4px solid var(--accent);line-height:1.3}
.toast.bad{border-left-color:var(--bad)}
.toast.good{border-left-color:var(--good)}
.box{position:absolute;left:3%;right:3%;bottom:3%;max-height:88%;display:flex;flex-direction:column;gap:6px;background:#0b0c0f;border:3px solid var(--ink);outline:3px solid #0b0c0f;padding:10px 12px;font-size:clamp(12px,3.3vw,16px);line-height:1.45}
.who{font-family:var(--pix);font-size:clamp(8px,2.2vw,11px);color:var(--accent);letter-spacing:.05em;line-height:1.5}
.txt{min-height:2.9em}
.more{align-self:flex-end;font-size:11px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lines{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:.9em}
.lines div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0}
.opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border:2px solid transparent;font-family:var(--ui);font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--ink);background:#1d2027}
.opt.sel span:first-child::before{content:"▶ ";color:var(--gold)}
.opt:focus-visible{outline:2px solid var(--accent)}
.foot{font-size:11px;color:var(--dim);text-align:right}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:12px;text-align:center;padding:16px;background:rgba(12,13,17,.86)}
.overlay h2{font-family:var(--pix);font-weight:400;font-size:clamp(16px,5vw,26px);margin:0;line-height:1.3;text-wrap:balance}
.overlay h2 span{color:var(--accent)}
.overlay p{margin:0;max-width:34ch;color:var(--dim);font-size:clamp(12px,3.2vw,15px);line-height:1.45}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:clamp(12px,3.3vw,15px);text-align:left;font-variant-numeric:tabular-nums}
.stats b{color:var(--gold);font-weight:700;text-align:right}
.go{all:unset;cursor:pointer;font-family:var(--pix);font-size:12px;padding:12px 16px;background:var(--accent);color:#0b0c0f;border:3px solid var(--ink);box-shadow:4px 4px 0 #000}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.tray{display:grid;grid-template-columns:1fr;gap:6px}
.tray section{background:var(--panel);border:2px solid var(--line);padding:4px 7px;display:flex;flex-direction:column;gap:3px;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:18px;max-height:40px;overflow-y:auto;align-items:flex-start}
.chip{font-size:11px;padding:2px 6px;background:#2c313b;border:1px solid var(--line);white-space:nowrap}
.empty{font-size:11px;color:var(--dim)}
.tickets{display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.25;max-height:40px;overflow-y:auto}
.tk{display:flex;gap:6px;align-items:baseline}
.dot{width:9px;height:9px;flex:none;border:1px solid #000;transform:translateY(1px)}
.tk s{color:var(--dim)}
.tk em{font-style:normal;color:var(--good)}
.pad{display:flex;justify-content:space-between;align-items:center;padding:0 6px;touch-action:none}
.dpad{position:relative;width:111px;height:111px;touch-action:none}
.dpad span{position:absolute;background:#2c313b;border:3px solid #0b0c0f;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.dpad .u,.dpad .d{left:37px;width:37px;height:40px}
.dpad .u{top:0;border-bottom:none}
.dpad .d{bottom:0;border-top:none}
.dpad .l,.dpad .r{top:37px;height:37px;width:40px}
.dpad .l{left:0;border-right:none}
.dpad .r{right:0;border-left:none}
.dpad i{position:absolute;left:37px;top:37px;width:37px;height:37px;background:#2c313b;border:0}
.dpad[data-dir="up"] .u,.dpad[data-dir="down"] .d,.dpad[data-dir="left"] .l,.dpad[data-dir="right"] .r{background:var(--accent)}
.ab{display:flex;gap:16px;align-items:center;transform:rotate(-14deg)}
.btn{all:unset;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--pix);font-size:15px;border:3px solid #0b0c0f;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);touch-action:none;cursor:pointer}
.btn.a{background:var(--bad);color:var(--ink);margin-top:-20px}
.btn.b{background:#3a404c;color:var(--ink);margin-top:20px}
.btn:active,.btn.on{filter:brightness(1.25)}
.keys{margin:0;color:var(--dim);font-size:12px;text-align:center}
@media (hover:hover) and (pointer:fine){ .pad{display:none} }
@media (hover:none),(pointer:coarse){ .keys{display:none} }
@media (max-width:420px){ h1{font-size:12px} .stock{gap:3px 6px} }
@media (prefers-reduced-motion:reduce){ .more{animation:none} }
</style>

</head>
<body>
<main class="wrap">
  <header class="top">
    <h1>ATLAS <span>SHIFT</span></h1>
    <button class="sv" id="menuBtn" aria-label="Open menu">MENU</button>
  </header>

  <div class="hud">
    <div><span class="lbl">Clock</span><b id="clock">11:00 AM</b></div>
    <div><span class="lbl">Sales</span><b id="sales">$0</b></div>
    <div><span class="lbl">Rating</span><b id="rating">—</b></div>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="192" height="192"></canvas>
    <div class="hint" id="hint"></div>
    <div class="toast" id="toast" hidden></div>
    <div class="box" id="box" hidden></div>
    <div class="overlay" id="overlay">
      <h2>ATLAS <span>SHIFT</span></h2>
      <p>First day on the sales floor. Doors open at 11. Help every customer find what they came for and ring them up before they lose patience.</p>
      <button class="go" id="start">CLOCK IN</button>
      <button class="go alt" id="loadTitle">LOAD SAVE</button>
      <p id="best"></p>
    </div>
  </div>

  <div class="tray">
    <section><span class="lbl">Tickets</span><div class="tickets" id="tickets"><span class="empty">No requests yet</span></div></section>
    <section class="wide" id="stockSec" hidden><span class="lbl">Floor stock</span><div class="stock" id="stock"></div></section>
  </div>

  <div class="pad" id="pad">
    <div class="dpad" id="dpad" aria-label="Direction pad"><span class="u"></span><span class="d"></span><span class="l"></span><span class="r"></span><i></i></div>
    <div class="ab"><button class="btn b" id="bB" aria-label="B button">B</button><button class="btn a" id="bA" aria-label="A button">A</button></div>
  </div>
  <p class="keys">Arrows or WASD to move · Space / E = A · X / Esc = B · M = menu</p>
</main>

<script>
(()=>{
const T=16,COLS=12,ROWS=12,W=COLS*T,H=ROWS*T;
const FLOOR_MAP=[
"WWWWWWWWWWWW",
"WBBAAVVAWKWW",
"GFFFFFFFFFFU",
"gRMCCCFFZZZW",
"DFFFFFFFFFFY",
"DFFTTTFJJJFH",
"DFFTTTFJJJFS",
"DFFTTTFJJJFS",
"DFFTTTFJJJFS",
"DFFFFFFFFFFS",
"WOONNNNNNNNW",
"PPPPPPPPPPPP"];
const STOCK_MAP=[
"QQQQQQQQQQQQ",
"QxxxxxxxxxxQ",
"Q,,,,,,,,,,Q",
"Qsss,xxxxxxQ",
"Qsvs,,,,,,,Q",
"Qsss,xxxxxxQ",
"Qsls,,,,,,,Q",
"Qsls,www,bbQ",
"Qsss,EEE,,,Q",
"Qsss,,,,,bbQ",
"Qrrr,kkqqmmQ",
"QQQQQQQQQQQQ"];
let MAP=FLOOR_MAP;
const setMap=n=>{MAP=n==='stock'?STOCK_MAP:FLOOR_MAP;};
const tileAt=(c,r)=>(r<0||c<0||c>=COLS)?'W':(r>=ROWS?'P':MAP[r][c]);

/* ---------- catalog ---------- */
const ITEMS={};
const add=(key,section,label,price,phrase)=>{ITEMS[key]={key,section,label,price,phrase};};
['8.0','8.25','8.5'].forEach(s=>add('deck-'+s,'decks',`Deck ${s}"`,s==='8.5'?75:70,`an ${s} deck`));
const BRANDS=[
  {id:'vans',name:'Vans',price:75,day:1,col:'#c0392b',col2:'#f1ede4'},
  {id:'converse',name:'Converse',price:80,day:1,col:'#f1ede4',col2:'#26282e'},
  {id:'nikesb',name:'Nike SB',price:95,day:4,col:'#2bb3a3',col2:'#1d1f24'},
  {id:'adidas',name:'Adidas',price:90,day:4,col:'#26282e',col2:'#f4f1ea'},
  {id:'nb',name:'New Balance',price:95,day:7,col:'#9aa1ad',col2:'#c0392b'},
  {id:'asics',name:'Asics',price:90,day:7,col:'#3f7fd6',col2:'#f2c14e'}];
const SHOE_SIZES=[8,9,10,11];
BRANDS.forEach(b=>SHOE_SIZES.forEach(s=>{add(`shoe-${b.id}-${s}`,'shoes',`${b.name} sz ${s}`,b.price,`${b.name} in a size ${s}`);ITEMS[`shoe-${b.id}-${s}`].brand=b.id;}));
const brandOpen=(b,lv)=>b.day<=lv;
[8,9,10,11].forEach(sz=>add('dunk-'+sz,'release',`SB Dunk sz ${sz}`,125,`SB Dunks in a size ${sz}`));
let drawLevel=1;
const SZ={S:'small',M:'medium',L:'large',XL:'XL'};
['S','M','L','XL'].forEach(s=>add('tee-'+s,'tees',`Tee ${s}`,40,`a tee in ${SZ[s]}`));
['M','L','XL'].forEach(s=>add('hood-'+s,'hoodies',`Hoodie ${s}`,90,`a hoodie in ${SZ[s]}`));
add('crew-L','hoodies','Crewneck L',75,'a crewneck in large');
['M','L'].forEach(s=>add('btn-'+s,'rack',`Button-up ${s}`,80,`a button-up in ${SZ[s]}`));
['M','L'].forEach(s=>add('jkt-'+s,'rack',`Jacket ${s}`,120,`a jacket in ${SZ[s]}`));
add('cap','hats','Cap',38,'a cap'); add('beanie','hats','Beanie',32,'a beanie');
add('wh-52','case','Wheels 52mm',45,'52mm wheels'); add('wh-54','case','Wheels 54mm',45,'54mm wheels');
add('tr-139','case','Trucks 139',60,'139 trucks'); add('tr-149','case','Trucks 149',60,'149 trucks');
add('bear','case','Bearings',25,'bearings');
add('grip','case','Griptape',12,'griptape'); add('socks','case','Socks',14,'socks'); add('stick','case','Sticker pack',5,'a sticker pack');
const SECTIONS={decks:'Deck wall',shoes:'Shoe wall',tees:'Tee table',hoodies:'Sweatshirt table',hats:'Hat shelf',rack:'Clothing rack',case:'Glass case'};
const TILE_SECTION={D:'decks',S:'shoes',T:'tees',J:'hoodies',Y:'hats',H:'rack',C:'case'};
const SHORT={decks:'Decks',shoes:'Shoes',tees:'Tees',hoodies:'Sweats',hats:'Hats',rack:'Rack',case:'Case'};
const SECTION_TILES=[];FLOOR_MAP.forEach((row,r)=>[...row].forEach((ch,c)=>{if(TILE_SECTION[ch])SECTION_TILES.push([c,r,TILE_SECTION[ch]]);}));
const STATIONS={b:['tees','hoodies','rack','hats'],x:['shoes'],k:['decks'],q:['case']};
const STATION_NAMES={b:'Clothing bins',x:'Shoe shelves',k:'Deck cubbies',q:'Wheels & hardware'};
const SKATE=new Set(['s','v','l','r']);
const STOCK_MAX=6;
const LEVELS=[
  {n:1,name:'Opening shift',target:250,goal:'Learn the floor. One item per customer.',maxItems:m=>1,complete:false,spawn:[26,18],cap:m=>m<60?1:2,pat:.45,clock:2.0,selfShare:.15,randCap:1,breakEvery:4,breakLen:10,stock:false},
  {n:2,name:'First restock',target:300,goal:'The stock room opens. Learn it at an easy pace.',maxItems:m=>1,complete:false,spawn:[30,22],cap:m=>2,pat:.4,bp:.25,clock:1.9,selfShare:.15,randCap:1,breakEvery:4,breakLen:12,stock:true,firstSpawn:25,
    startStock:{decks:1,shoes:4,tees:4,hoodies:4,hats:3,rack:3,case:4}},
  {n:3,name:'Saturday',target:450,goal:'More customers, some want two items.',maxItems:m=>m<240?1:2,complete:false,spawn:[22,15],cap:m=>m<160?2:3,pat:.55,bp:.45,clock:2.0,selfShare:.2,randCap:2,breakEvery:5,breakLen:10,stock:true,
    startStock:{decks:3,shoes:3,tees:3,hoodies:3,hats:2,rack:2,case:3}},
  {n:4,name:'Release day',target:900,goal:'SB Dunk drop. A line out front, limited pairs.',maxItems:m=>m<240?1:2,complete:false,spawn:[32,22],cap:m=>2,pat:.5,bp:.45,clock:2.0,selfShare:.2,randCap:1,breakEvery:6,breakLen:8,stock:true,release:true,
    startStock:{decks:4,shoes:4,tees:3,hoodies:3,hats:2,rack:2,case:3}},
  {n:5,name:'Restock day',target:450,goal:'The release wiped the floor. Balance customers and restocks.',maxItems:m=>m<240?1:2,complete:false,spawn:[24,16],cap:m=>m<160?2:3,pat:.5,bp:.4,clock:2.0,selfShare:.25,randCap:2,breakEvery:5,breakLen:10,stock:true,
    startStock:{decks:2,shoes:3,tees:3,hoodies:2,hats:2,rack:2,case:3}},
  {n:6,name:'Build day',target:650,goal:'Customers start building completes.',maxItems:m=>m<200?1:2,complete:true,spawn:[20,13],cap:m=>3,pat:.6,bp:.55,clock:2.1,selfShare:.3,randCap:2,breakEvery:6,breakLen:9,stock:true,
    startStock:{decks:4,shoes:3,tees:3,hoodies:3,hats:2,rack:2,case:4}},
  {n:7,name:'New arrivals',target:800,goal:'New Balance and Asics arrive. Bigger orders.',maxItems:m=>m<160?2:3,complete:true,spawn:[18,11],cap:m=>m<200?3:4,pat:.7,bp:.65,clock:2.2,selfShare:.3,randCap:2,breakEvery:6,breakLen:8,stock:true,
    startStock:{decks:3,shoes:3,tees:3,hoodies:2,hats:2,rack:2,case:3}},
  {n:8,name:'Holiday rush',target:1000,goal:'The busiest day of the year.',maxItems:m=>m<90?2:3,complete:true,spawn:[15,9],cap:m=>4,pat:.8,bp:.7,clock:2.3,selfShare:.3,randCap:2,breakEvery:7,breakLen:8,stock:true,
    startStock:{decks:3,shoes:3,tees:2,hoodies:2,hats:2,rack:2,case:3}}];
const LV=()=>LEVELS[(G&&G.level||1)-1];
const SPOTS={decks:[1,7],shoes:[10,8],tees:[4,9],hoodies:[8,9],hats:[10,4],rack:[10,5],case:[5,4]};
const WEIGHTS=[['decks',4],['shoes',4],['tees',3],['hoodies',2],['hats',2],['case',3],['rack',1]];
const rowY=r=>r*T+12, colX=c=>c*T+8;
const TRUNK=32, OFF=H+18;
const hubOf=y=>y<=rowY(4)+2?rowY(4):rowY(9);
function route(fx,fy,tx,ty){
  if(fy>=rowY(10)&&ty>=rowY(10))return [[tx,fy],[tx,ty]];
  if(fy>=rowY(10)&&fx!==TRUNK)return [[TRUNK,fy]].concat(route(TRUNK,fy,tx,ty));
  const h1=hubOf(fy),h2=hubOf(ty);
  const P=h1===h2?[[fx,h1],[tx,h1],[tx,ty]]:[[fx,h1],[TRUNK,h1],[TRUNK,h2],[tx,h2],[tx,ty]];
  const out=[];let px=fx,py=fy;
  for(const q of P){if(q[0]!==px||q[1]!==py){out.push(q);px=q[0];py=q[1];}}
  return out;
}

/* ---------- pixel helpers ---------- */
const R=(c,x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x,y,w,h);};
function mulberry(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const pick=(a,rnd=Math.random)=>a[Math.floor(rnd()*a.length)];

const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const floorRoom=document.createElement('canvas'),stockRoom=document.createElement('canvas');
[floorRoom,stockRoom].forEach(k=>{k.width=W;k.height=H;});
let rc;

function finishIdle(c){
  if(c.kind==='hang')return leave(c,null);
  if(c.kind==='browse'){
    c.hops--;c.stand=null;
    if(c.hops<=0&&Math.random()<.4){
      const buyers=G.customers.filter(o=>o!==c&&o.state!=='leave'&&o.kind!=='hang'&&o.kind!=='browse').length;
      if(buyers<LV().cap(G.minute)){
        const rq=genRequest(G.minute),sp2=pickStand(ITEMS[rq.req[0]].section);
        if(sp2){const self=Math.random()<.4;c.kind=self?'self':'buyer';c.req=rq.req;c.got=[];c.text=`Okay, you talked me into it. I'll take ${listText(rq.req.map(k=>ITEMS[k].phrase))}.`;
          c.stand=[sp2.c,sp2.r];c.talk=self?null:sp2.talk;c.state='in';c.patience=100;c.path=route(c.x,c.y,colX(sp2.c),rowY(sp2.r));return;}
      }
    }
    const sp=c.hops>0?pickStand(pick(Object.keys(SECTIONS))):null;
    if(!sp)return leave(c,null);
    c.stand=[sp.c,sp.r];c.state='in';c.path=route(c.x,c.y,colX(sp.c),rowY(sp.r));return;
  }
  // self-serve: take their own items, unless the shelf is empty
  const secs=[...new Set(c.req.map(k=>ITEMS[k].section))];
  if(G.stock&&secs.some(s2=>G.stock[s2]<=0)){c.kind='buyer';c.state='wait';c.dir='down';c.talk=talkFor(c.stand[0],c.stand[1],ITEMS[c.req[0]].section,takenTiles());return;}
  if(G.stock)c.req.forEach(k=>{const s2=ITEMS[k].section;G.stock[s2]=Math.max(0,G.stock[s2]-1);});
  if(Math.random()<.7)addMess(c.stand,ITEMS[c.req[0]].section);
  c.got=c.req.slice();c.carry=true;c.asked=true;c.mood='<3';c.moodT=1.2;joinQueue(c);
}
function updateCustomer(c,dt){
  c.moving=false;
  if(c.path.length){
    const [tx,ty]=c.path[0],dx=tx-c.x,dy=ty-c.y,d=Math.hypot(dx,dy),sp=34*dt;
    if(d<=sp){c.x=tx;c.y=ty;c.path.shift();
      if(c.dropPt&&tx===c.dropPt[0]&&ty===c.dropPt[1]){c.dropPt=null;c.board=false;(G.boards=G.boards||[]).push({col:c.dropCol,color:c.boardCol,owner:c.id});c.dir='down';}
      if(c.pickPt&&tx===c.pickPt[0]&&ty===c.pickPt[1]){c.pickPt=null;c.board=true;G.boards=(G.boards||[]).filter(b=>b.owner!==c.id);}}
    else{c.x+=dx/d*sp;c.y+=dy/d*sp;c.moving=true;c.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}
    c.ft+=dt;if(c.ft>.17){c.ft=0;c.frame++;}
  }else if(c.state==='in'){
    if(!c.kind||c.kind==='buyer'){c.state='wait';c.dir='down';}
    else{c.state='idle';c.idleT=c.kind==='hang'?18+Math.random()*20:c.kind==='self'?2.5:4+Math.random()*4;
      c.dir=c.kind==='hang'?pick(['left','right','down']):pick(['left','right','up']);}
  }else if(c.state==='idle'){
    c.idleT-=dt;
    if(c.kind==='hang'&&Math.random()<dt*.15)c.dir=pick(['left','right','down','up']);
    if(c.idleT<=0)finishIdle(c);
  }
  if(c.moodT>0)c.moodT-=dt;
  const arrived=!c.path.length;
  if(c.state==='wait'&&arrived){c.patience-=persOf(c).pat*(c.asked?1.15:1.6)*(messyFor(c)?1.4:1)*LV().pat*(G.map==='stock'?(LV().bp||1):1)*dt;}
  else if(c.state==='queue'&&arrived){c.patience-=persOf(c).pat*.85*LV().pat*(G.map==='stock'?(LV().bp||1):1)*dt;c.dir=G.queue[0]===c?'up':'left';}
  if((c.state==='wait'||c.state==='queue')&&c.patience<=0){
    G.walkouts++;G.stars.push(1);sfx.bad();G.breakT=Math.max(G.breakT||0,6);if(c.release&&G.release)G.release.claim[c.size]++;toast(`${nameOf(c)} ${DLG.walk[c.pers]||DLG.walk.normal}`,'bad');leave(c,'x');
  }
  if(c.state==='leave'&&!c.path.length){G.customers.splice(G.customers.indexOf(c),1);}
}

/* ---------- player ---------- */
const hold={up:0,down:0,left:0,right:0};let lastDir='down';const presses=[];
const DIRV={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]};
const walkable=ch=>ch==='F'||ch==='O'||ch===','||SKATE.has(ch);
const solidAt=(px,py)=>!walkable(tileAt(Math.floor(px/T),Math.floor(py/T)));
const blocked=(x,y)=>solidAt(x-5,y-5)||solidAt(x+5,y-5)||solidAt(x-5,y-.5)||solidAt(x+5,y-.5);
const tileUnder=p=>tileAt(Math.floor(p.x/T),Math.floor((p.y-3)/T));
const KICKER_TRICKS=['Kickflip','Heelflip','360 flip','Pop shove-it','Varial flip','Hardflip'];
const QP_TRICKS=['Frontside air','Backside air','Rock to fakie','Axle stall','Disaster'];
function readSkateBest(){try{return +localStorage.getItem('atlas-shift-skate')||0;}catch(_){return 0;}}
function launch(p,dur,kind){p.air=p.airMax=dur;p.launch=kind;p.overLedge=false;blip(kind==='ollie'?520:640,.08,'square',.04,240);}
function ollie(){const p=G.player;if(p.air>0)return;launch(p,tileUnder(p)==='v'?.75:.42,tileUnder(p)==='v'?'kicker':'ollie');}
function land(p){
  const under=tileUnder(p);let name,pts;
  if(p.launch==='qp'){name=pick(QP_TRICKS);pts=60;}
  else if(under==='l'){name='50-50 grind';pts=45;}
  else if(p.launch==='kicker'){name=pick(KICKER_TRICKS);pts=50;}
  else if(p.overLedge){name='Ollie over the ledge';pts=30;}
  else{name='Ollie';pts=10;}
  const sk=G.sk||(G.sk={score:0,combo:0,comboT:0});
  sk.combo=sk.comboT>0?sk.combo+1:1;sk.comboT=1.6;
  const got=pts*sk.combo;sk.score+=got;
  const best=readSkateBest();if(sk.score>best){try{localStorage.setItem('atlas-shift-skate',String(sk.score));}catch(_){}}
  toast(`${name} +${got}${sk.combo>1?` (x${sk.combo})`:''} · Skate ${sk.score}`,'good');blip(330,.06,'triangle',.05);
}
function updatePlayer(dt){
  const p=G.player;let dx=hold.right-hold.left,dy=hold.down-hold.up;
  const onSkate=G.map==='stock'&&SKATE.has(tileUnder(p));
  if(G.sk&&G.sk.comboT>0)G.sk.comboT-=dt;
  if(onSkate||p.air>0){
    if(!p.skate){p.skate=true;p.vx=p.vx||0;p.vy=p.vy||0;}
    if(dx||dy){const len=Math.hypot(dx,dy);p.vx+=(dx/len*100-p.vx)*Math.min(1,dt*4);p.vy+=(dy/len*100-p.vy)*Math.min(1,dt*4);
      if(hold[lastDir])p.dir=lastDir;else p.dir=dx?(dx>0?'right':'left'):(dy>0?'down':'up');}
    else{p.vx*=1-Math.min(1,dt*1.1);p.vy*=1-Math.min(1,dt*1.1);}
    const under=tileUnder(p);
    if(p.air<=0&&under==='r'&&p.vy>25){launch(p,.7,'qp');p.vy=-Math.abs(p.vy)*.95;}
    if(p.air<=0&&under==='v'&&Math.hypot(p.vx,p.vy)>55&&p.dir==='down'){launch(p,.75,'kicker');}
    const mx=p.vx*dt,my=p.vy*dt;
    if(!blocked(p.x+mx,p.y))p.x+=mx;else p.vx=0;
    if(!blocked(p.x,p.y+my))p.y+=my;else p.vy=0;
    if(p.air>0){if(tileUnder(p)==='l')p.overLedge=true;p.air-=dt;if(p.air<=0){p.air=0;land(p);}}
    p.moving=Math.hypot(p.vx,p.vy)>8;
    if(!SKATE.has(tileUnder(p))&&p.air<=0){p.skate=false;p.vx=p.vy=0;}
    return;
  }
  p.skate=false;
  p.moving=!!(dx||dy);
  if(p.moving){
    if(hold[lastDir])p.dir=lastDir;else p.dir=dx?(dx>0?'right':'left'):(dy>0?'down':'up');
    const len=Math.hypot(dx,dy),sp=62*dt;dx=dx/len*sp;dy=dy/len*sp;
    if(!blocked(p.x+dx,p.y))p.x+=dx;
    if(!blocked(p.x,p.y+dy))p.y+=dy;
    p.ft+=dt;if(p.ft>.14){p.ft=0;p.frame++;}
  }
}
function target(){
  const p=G.player,[fx,fy]=DIRV[p.dir],cx=p.x,cy=p.y-4;
  if(G.map==='floor'){const ptc=Math.floor(p.x/T),ptr=Math.floor((p.y-3)/T);
    for(const c of G.customers)if(c.state==='wait'&&c.talk&&!c.path.length&&c.talk[0]===ptc&&c.talk[1]===ptr)return {kind:'customer',c};
    const ftc=Math.floor((cx+fx*10)/T),ftr=Math.floor((cy+fy*10)/T);
    const ms=(G.messes||[]).find(m=>(m.c===ptc&&m.r===ptr)||(m.c===ftc&&m.r===ftr));
    if(ms)return {kind:'mess',m:ms};}
  if(G.map==='floor'&&p.dir!=='up'&&p.y<3*T+6&&p.y>T&&p.x<3*T+4)return {kind:'tile',ch:'R',tc:1,tr:3};
  let best=null,bd=99;
  for(const c of (G.map==='floor'?G.customers:[])){
    if(c.state!=='wait'&&c.state!=='queue'&&c.state!=='idle')continue;
    const vx=c.x-cx,vy=(c.y-4)-cy,dot=vx*fx+vy*fy,dist=Math.hypot(vx,vy);
    if(dot>2&&dist<20&&dist<bd){bd=dist;best=c;}
  }
  if(best)return {kind:'customer',c:best};
  for(const d of [9,15]){
    const tc=Math.floor((cx+fx*d)/T),tr=Math.floor((cy+fy*d)/T),ch=tileAt(tc,tr);
    if(walkable(ch))continue;
    return {kind:'tile',ch,tc,tr};
  }
  return null;
}
function hintFor(t){
  if(!t)return '';
  if(t.kind==='customer')return 'A · Talk';
  if(t.kind==='mess')return 'A · Clean up';
  const ch=t.ch;
  if(TILE_SECTION[ch])return 'A · '+SECTIONS[TILE_SECTION[ch]];
  if(ch==='R')return 'A · Register';
  if(ch==='B')return 'A · Workbench';
  if(ch==='K')return 'A · Stock room';
  if(ch==='M')return 'A · Desk';
  if(ch==='g')return 'A · Your drink';
  if(ch==='V')return 'A · TV';
  if(ch==='U')return G.release?'A · Release stash':'A · Fitting room';
  if(ch==='Z')return 'A · Gallery wall';
  if(ch==='N')return 'A · Window';
  if(STATIONS[ch])return 'A · '+STATION_NAMES[ch];
  const F={E:'Stairs up',w:'Packing table',m:'Photo station',f:'Fan',u:'Trash can',p:'Support post'};
  if(F[ch])return 'A · '+F[ch];
  return '';
}

let dlg=null,pk=null;
function say(lines,after){dlg={lines:lines.slice(),after,shown:0};ui='dialog';renderBox();}
function renderBox(){

    box.innerHTML=`<div class="who">${L.who}</div><div class="txt">${txt}</div><div class="more">${dlg.shown>=L.text.length?'▼':'&nbsp;'}</div>`;
  }else if(ui==='picker'){
    box.innerHTML=`<div class="who">${pk.title}</div>`+
      (pk.lines?`<div class="lines">${pk.lines.map(l=>`<div><span>${l[0]}</span><span>${l[1]}</span></div>`).join('')}</div>`:'')+
      (pk.prompt?`<div>${pk.prompt}</div>`:'')+
      `<div class="opts">${pk.options.map((o,i)=>`<button class="opt${i===pk.sel?' sel':''}" id="opt${i}" data-i="${i}"><span>${o.label}</span><span>${o.right||''}</span></button>`).join('')}</div>`+
      `<div class="foot">A pick · B back</div>`;

function closeBox(){box.hidden=true;box.innerHTML='';ui='play';}
function advanceDialog(){
  const L=dlg.lines[0];
  if(dlg.shown<L.text.length){dlg.shown=L.text.length;renderBox();return;}
  dlg.lines.shift();dlg.shown=0;sfx.talk();
  if(dlg.lines.length)renderBox();

}
function openPicker(o){pk=Object.assign({sel:0},o);ui='picker';renderBox();sfx.talk();}
box.addEventListener('click',e=>{

  if(ui==='picker'){const b=e.target.closest('.opt');if(b){pk.sel=+b.dataset.i;choosePick();}}

function choosePick(){const o=pk.options[pk.sel],f=pk.onPick;pk=null;closeBox();f(o.value);}

function interact(){
  const t=target();if(!t)return;
  if(t.kind==='customer')return talkTo(t.c);
  if(t.kind==='mess')return cleanMess(t.m);
  const ch=t.ch;
  if(G.map==='stock')return interactStock(ch);
  if(TILE_SECTION[ch])return openSection(TILE_SECTION[ch]);
  if(ch==='R')return register();
  if(ch==='B')return say([{who:'Workbench',text:'Griptape station and assembly bench. Building completes for customers comes in the next update.'}]);

    if(!LV().stock)return say([{who:'Stock room',text:'Locked. The basement stock room opens on Day 3.'}]);
    G.map='stock';setMap('stock');Object.assign(G.player,{x:colX(6),y:rowY(9),dir:'up',skate:false,air:0,vx:0,vy:0});sfx.door();

  }
  if(ch==='V')return say([{who:'TV',text:'Skate videos on loop all day.'}]);

  if(ch==='N')return say([{who:'Window bench',text:'Where the regulars hang out. 2nd Avenue, downtown San Mateo. Open 11 to 7, every day.'}]);

function talkTo(c){
  const p=G.player;{const dx=c.x-p.x,dy=c.y-p.y;p.dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');}c.dir=({up:'down',down:'up',left:'right',right:'left'})[p.dir];

    if(c.kind==='hang')return say([{who,text:pick(c.pers==='story'?DLG.stories:DLG.hang)}]);
    if(c.kind==='browse')return say([{who,text:pick(DLG.browse)}]);

  }

    if(c.release&&!c.got.length)return say([{who,text:c.swapped?`They're out of my size, so I'll take a ${c.size}. I'll make it work.`:pick([`Size ${c.size}! I've been out there since 6 AM.`,`SB Dunks, size ${c.size}. My chair and I have been through a lot today.`,`Size ${c.size}, please. My whole crew is gonna be so jealous.`])}]);

        onPick:i=>say([{who,text:q.r[i]},{who,text:`Oh right. I need ${listText(c.req.map(k=>ITEMS[k].phrase))}.`}])}));}

  if(give.length){
    c.got.push(...give);sfx.grab();
    const left=stillNeeds(c);
    if(!left.length){c.patience=Math.min(100,c.patience+15);c.mood='<3';c.moodT=1.6;joinQueue(c);
      return say([{who,text:pick(["Perfect, that's it. I'll meet you at the register.","Sick, thank you! Heading to the counter.","That's the one. Ready to pay."])}]);}
    c.patience=Math.min(100,c.patience+8);

  if(G.hands.length){

}

/* ---------- background music: an original lo-fi boom-bap loop, synthesized live ---------- */
function readMusic(){try{return localStorage.getItem('atlas-shift-music')!=='0';}catch(_){return true;}}
function writeMusic(v){try{localStorage.setItem('atlas-shift-music',v?'1':'0');}catch(_){}}
const music={on:readMusic(),bus:null,lp:null,timer:null,next:0,step:0,bar:0,noise:null,lpT:0};
const BPM=88,STEP=60/BPM/4,mtof=m=>440*Math.pow(2,(m-69)/12);
const PROG=[{bass:41,ch:[53,57,60,64]},{bass:40,ch:[52,55,59,62]},{bass:38,ch:[50,53,57,60,64]},{bass:45,ch:[55,60,64,67]}];
function musicInit(){
  if(!ac||music.bus)return;
  music.bus=ac.createGain();music.bus.gain.value=0;
  music.lp=ac.createBiquadFilter();music.lp.type='lowpass';music.lp.frequency.value=18000;
  const comp=ac.createDynamicsCompressor();
  music.bus.connect(music.lp).connect(comp).connect(ac.destination);
  const buf=ac.createBuffer(1,ac.sampleRate,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;music.noise=buf;
}
function env(g,t,peak,a,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
function mKick(t){const o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(48,t+.12);env(g,t,.9,.003,.38);o.connect(g).connect(music.bus);o.start(t);o.stop(t+.45);}
function mNoise(t,type,freq,peak,dec){const n=ac.createBufferSource();n.buffer=music.noise;const f=ac.createBiquadFilter();f.type=type;f.frequency.value=freq;const g=ac.createGain();env(g,t,peak,.002,dec);n.connect(f).connect(g).connect(music.bus);n.start(t,Math.random()*.5);n.stop(t+dec+.05);}
function mSnare(t){mNoise(t,'bandpass',1900,.45,.2);const o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(200,t);o.frequency.exponentialRampToValueAtTime(140,t+.08);env(g,t,.25,.002,.1);o.connect(g).connect(music.bus);o.start(t);o.stop(t+.15);}
function mHat(t,open){mNoise(t,'highpass',7500,open?.12:.08,open?.18:.035);}
function mBass(t,m,dur){[[1,'sine',.38],[2,'triangle',.09]].forEach(([h,type,pk])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=mtof(m)*h;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(pk,t+.01);g.gain.setValueAtTime(pk,t+dur*.6);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(music.bus);o.start(t);o.stop(t+dur+.02);});}
function mChord(t,notes,dur,peak){notes.forEach(m=>[[0,'sine',1],[5,'triangle',.35]].forEach(([det,type,k])=>{const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=mtof(m);o.detune.value=det;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak*k,t+.015);g.gain.exponentialRampToValueAtTime(peak*k*.4,t+dur*.4);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(music.bus);o.start(t);o.stop(t+dur+.02);}));}
function mStep(step,bar,t){
  t+=step%2?STEP*.18:0;

  if(step===0||step===10||(bar%2===1&&step===7)||(bar%4===3&&step===14))mKick(t);
  if(step===4||step===12)mSnare(t);
  if(step%2===0)mHat(t,step===14&&bar%2===1);else if(bar%4===3&&step>=12)mHat(t,false);
  if(step===0)mChord(t,P.ch,STEP*9,.035);
  if(step===11)mChord(t,P.ch,STEP*3,.022);
  const bl={0:[P.bass,STEP*5],6:[P.bass+12,STEP*2],10:[P.bass,STEP*3],14:[P.bass+7,STEP*2]}[step];
  if(bl)mBass(t,bl[0],bl[1]);
}
function musicTick(){
  if(!ac||!music.on)return;
  const f=G&&G.map==='stock'?900:18000;
  if(music.lpT!==f){music.lpT=f;music.lp.frequency.setTargetAtTime(f,ac.currentTime,.25);}
  if(music.next<ac.currentTime)music.next=ac.currentTime+.05;
  while(music.next<ac.currentTime+.15){mStep(music.step,music.bar,music.next);music.next+=STEP;if(++music.step===16){music.step=0;music.bar++;}}
}
function musicStart(){
  if(!ac)return;musicInit();if(music.timer)return;
  music.next=ac.currentTime+.1;music.step=0;
  music.bus.gain.cancelScheduledValues(ac.currentTime);music.bus.gain.setTargetAtTime(.22,ac.currentTime,.4);

}
function musicStop(){if(music.timer){clearInterval(music.timer);music.timer=null;}if(music.bus)music.bus.gain.setTargetAtTime(0,ac.currentTime,.08);}

    onPick:i=>{
      if(i<0||!saves[i]){if(i>=0)toast(`Slot ${i+1} is empty.`,'bad');back();return;}
      ensureAudio();restore(saves[i].state);
      toast(`Loaded slot ${i+1} · ${fmtClock(G.minute)}, $${G.sales} in sales`,'good');
    }});
}
function openMenu(selVal){
  if(ui==='dialog'){toast('Finish the conversation first.','bad');return;}
  if(ui==='picker'){const oc=pk.onCancel;pk=null;closeBox();if(oc)oc();return;}
  const prev=ui,fromOverlay=prev==='title'||prev==='end',inShift=!fromOverlay&&G&&!G.over;
  const back=()=>{if(fromOverlay){overlay.hidden=false;ui=prev;}};
  if(fromOverlay)overlay.hidden=true;
  const opts=[];
  if(inShift)opts.push({label:'Resume',value:'resume'});
  opts.push({label:'Music',right:music.on?'ON':'OFF',value:'music'});
  if(inShift)opts.push({label:'Save game',value:'save'});
  opts.push({label:'Load game',value:'load'});
  if(inShift)opts.push({label:'Quit to all days',value:'quit'});
  if(fromOverlay)opts.push({label:'Close menu',value:'close'});
  openPicker({title:inShift?'Paused':'Menu',options:opts,sel:Math.max(0,opts.findIndex(o=>o.value===selVal)),onCancel:back,onPick:v=>{
    if(v==='music'){toggleMusic();ui=prev;openMenu('music');return;}
    if(v==='save')return openSave();
    if(v==='load'){if(fromOverlay)ui=prev;return openLoad();}
    if(v==='quit')return openPicker({title:'Quit this day?',prompt:'Anything since your last save is lost.',options:[{label:'Keep playing',value:0},{label:'Quit to all days',value:1}],
      onPick:q=>{if(q){G.over=true;box.hidden=true;renderTitle();}}});
    back();
  }});
}
$('menuBtn').addEventListener('click',()=>{ensureAudio();openMenu();});
G=freshState();
renderTitle();
const wrapEl=document.querySelector('.wrap'),screenEl=$('screen');
function fit(){
  const cs=getComputedStyle(wrapEl),gap=parseFloat(cs.rowGap)||0;
  let used=parseFloat(cs.paddingTop)+parseFloat(cs.paddingBottom),n=0;
  for(const el of wrapEl.children){if(el===screenEl||getComputedStyle(el).display==='none')continue;used+=el.offsetHeight;n++;}
  used+=gap*n;
  const size=Math.max(180,Math.min(wrapEl.clientWidth,560,wrapEl.clientHeight-used));
  screenEl.style.width=screenEl.style.height=Math.floor(size)+'px';
}
addEventListener('resize',fit);
try{new ResizeObserver(fit).observe(document.querySelector('.tray'));}catch(_){}
fit();setTimeout(fit,300);
requestAnimationFrame(frame);
})();
</script>
