<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#15171c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Atlas Shift: a pixel art skate shop retail game set at Atlas Skateboarding in San Mateo.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%2315171c'/%3E%3Crect x='6' y='2' width='4' height='12' rx='2' fill='%2300aeef'/%3E%3Crect x='5' y='4' width='6' height='1' fill='%23f1ede4'/%3E%3Crect x='5' y='11' width='6' height='1' fill='%23f1ede4'/%3E%3C/svg%3E">
<title>Atlas Shift</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Silkscreen:wght@400;700&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
html{height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{margin:0;font:14px/1.4 system-ui,sans-serif}
img{max-width:100%}
</style>
<style>
/* Layout: one centered column — score strip, the shop screen, what you're holding, then the controller */
:root{
  color-scheme: dark;
  --bg:#15171c;
  --panel:#20242c;
  --line:#343a45;
  --ink:#f1ede4;
  --dim:#9aa1ad;
  --accent:#00aeef;
  --gold:#f2c14e;
  --bad:#ec5b52;
  --good:#4fc47f;
  --pix:'Press Start 2P', ui-monospace, Menlo, monospace;
  --ui:'Silkscreen', ui-monospace, Menlo, monospace;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background:var(--bg);color:var(--ink);font-family:var(--ui);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
}
.wrap{max-width:720px;height:100%;margin:0 auto;padding-block:6px 8px;display:flex;flex-direction:column;gap:6px;box-sizing:border-box}
.wrap>*{flex:none}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.top .saves{display:flex;gap:6px}
h1{font-family:var(--pix);font-size:15px;margin:0;letter-spacing:.06em;font-weight:400}
h1 span{color:var(--accent)}
.sub{margin:0;color:var(--dim);font-size:12px;letter-spacing:.04em}
.hud{display:grid;grid-template-columns:1.2fr 1.35fr .7fr auto;gap:5px;height:40px;flex:none}
.hud>div{overflow:hidden}
.hud .sv{align-self:stretch;display:grid;place-items:center}
.breakmode .hud{display:grid!important}
body{overflow-x:hidden}
.hud div{background:var(--panel);border:2px solid var(--line);padding:4px 6px;display:flex;flex-direction:column;gap:2px;min-width:0}
.lbl{font-size:9px;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
.hud b{font-family:var(--pix);font-size:10px;overflow:hidden;font-weight:400;font-variant-numeric:tabular-nums;white-space:nowrap}
#rating{color:var(--gold)}
.sv{all:unset;cursor:pointer;text-align:center;font-family:var(--pix);font-size:9px;padding:7px 9px;background:var(--panel);border:2px solid var(--line);color:var(--ink)}
.sv:hover{border-color:var(--dim)}
.sv.on{border-color:var(--accent);color:var(--accent)}
.sv.off{color:var(--dim);text-decoration:line-through}
.sv:active{background:#2c313b}
.sv:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.go.alt{background:var(--panel);color:var(--ink)}
.levels{display:flex;flex-direction:column;gap:6px;width:min(100%,330px)}
.lv{all:unset;cursor:pointer;display:grid;grid-template-columns:auto 1fr;gap:1px 10px;align-items:baseline;text-align:left;padding:6px 10px;background:var(--panel);border:2px solid var(--ink)}
.lv b{font-family:var(--pix);font-weight:400;font-size:10px;color:var(--accent);grid-row:span 2}
.lv span{font-size:13px}
.lv small{font-size:11px;color:var(--dim);line-height:1.25}
.lv[disabled]{opacity:.45;cursor:default;border-color:var(--line)}
.lv:not([disabled]):hover{background:#2c313b}
.lv:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tray .wide{grid-column:1/-1}
.stock{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px 10px}
.st{display:flex;justify-content:space-between;align-items:center;gap:4px;font-size:10px;min-width:0}
.segs{display:flex;gap:2px}
.segs{gap:1px}
.segs i{width:4px;height:7px;background:#3a404c}
.segs i.on{background:var(--good)}
.st.low .segs i.on{background:var(--gold)}
.st.out{color:var(--bad)}
.chip.boxc{background:#5e3d24;border-color:#c08b55}
.screen{position:relative;width:min(100%,560px);aspect-ratio:1/1;margin:0 auto;box-sizing:border-box;background:#000;border-block:2px solid var(--line);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.hint{position:absolute;bottom:6px;right:6px;font-family:var(--pix);font-size:9px;background:rgba(10,11,14,.82);color:var(--ink);padding:5px 7px;border:2px solid var(--ink)}
.hint:empty{display:none}
.toast{position:absolute;top:calc(8.4% + 4px);left:6px;max-width:62%;font-size:13px;background:rgba(10,11,14,.88);padding:5px 8px;border-left:4px solid var(--accent);line-height:1.3}
.callout{position:absolute;left:6px;bottom:6px;max-width:66%;background:#f4f1ea;color:#15171c;border:3px solid #0b0c0f;padding:5px 8px 6px;font-size:12px;line-height:1.3;box-shadow:3px 3px 0 #0b0c0f;animation:pop .18s steps(3)}
.callout::after{content:"";position:absolute;left:14px;top:-9px;border:6px solid transparent;border-bottom-color:#0b0c0f}
.callout b{display:flex;align-items:center;gap:5px;font-family:var(--pix);font-weight:400;font-size:8px;margin-bottom:3px;color:#3a404c}
.callout i{width:8px;height:8px;border:1px solid #0b0c0f;flex:none}
@keyframes pop{from{transform:scale(.6);opacity:.2}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.callout{animation:none}}
.toast.bad{border-left-color:var(--bad)}
.toast.good{border-left-color:var(--good)}
.box{position:absolute;left:3%;right:3%;bottom:3%;max-height:88%;display:flex;flex-direction:column;gap:6px;background:#0b0c0f;border:3px solid var(--ink);outline:3px solid #0b0c0f;padding:10px 12px;font-size:clamp(12px,3.3vw,16px);line-height:1.45}
.who{font-family:var(--pix);font-size:clamp(8px,2.2vw,11px);color:var(--accent);letter-spacing:.05em;line-height:1.5}
.txt{min-height:2.9em}
.more{align-self:flex-end;font-size:11px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.lines{display:flex;flex-direction:column;gap:2px;color:var(--dim);font-size:.9em;overflow-y:auto;min-height:0}
.lines .full{color:var(--ink,#f1ede4);white-space:normal}
.lines .dot{display:inline-block;margin-right:6px}
.split .col{cursor:pointer}
.lines div{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.opts{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0}
.opt{all:unset;cursor:pointer;display:flex;justify-content:space-between;gap:10px;padding:5px 8px;border:2px solid transparent;font-family:var(--ui);font-variant-numeric:tabular-nums}
.opt.sel{border-color:var(--ink);background:#1d2027}
.opt.sel span:first-child::before{content:"▶ ";color:var(--gold)}
.opt:focus-visible{outline:2px solid var(--accent)}
.foot{font-size:11px;color:var(--dim);text-align:right}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:safe center;overflow-y:auto;gap:12px;text-align:center;padding:16px;background:rgba(12,13,17,.86)}
.overlay h2{font-family:var(--pix);font-weight:400;font-size:clamp(16px,5vw,26px);margin:0;line-height:1.3;text-wrap:balance}
.overlay h2 span{color:var(--accent)}
.overlay p{margin:0;max-width:34ch;color:var(--dim);font-size:clamp(12px,3.2vw,15px);line-height:1.45}
.stats{display:grid;grid-template-columns:auto auto;gap:4px 18px;font-size:clamp(12px,3.3vw,15px);text-align:left;font-variant-numeric:tabular-nums}
.stats b{color:var(--gold);font-weight:700;text-align:right}
.go{all:unset;cursor:pointer;font-family:var(--pix);font-size:12px;padding:12px 16px;background:var(--accent);color:#0b0c0f;border:3px solid var(--ink);box-shadow:4px 4px 0 #000}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.go:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.tray{display:grid;grid-template-columns:1fr;gap:6px;flex:none}
.tray section{background:var(--panel);border:2px solid var(--line);padding:4px 7px;display:flex;flex-direction:column;gap:3px;min-width:0;box-sizing:border-box;height:56px;overflow:hidden}
.tray section .lbl{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:none}
#stockSec.off .stock{opacity:.35}
.chips{display:flex;flex-wrap:wrap;gap:3px;min-height:18px;max-height:40px;overflow-y:auto;align-items:flex-start}
.chip{font-size:11px;padding:2px 6px;background:#2c313b;border:1px solid var(--line);white-space:nowrap}
.empty{font-size:11px;color:var(--dim)}
.tickets{display:flex;flex-direction:column;gap:2px;font-size:11px;line-height:1.25;flex:1;min-height:0;overflow:hidden;scroll-behavior:smooth}
.tray section.split{flex-direction:row;gap:7px}
.split .col{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;position:relative}
.split .col+.col{border-left:2px solid var(--line);padding-left:7px}
.split .tickets{padding-right:18px}
.split .tk span:last-child{min-width:0}
#todo .tk span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#todo .tk.off{opacity:.38}
.more{all:unset;cursor:pointer;position:absolute;right:-2px;bottom:-2px;font-size:10px;line-height:1;padding:3px 5px;background:var(--line);color:var(--gold)}
.todo-hot{color:var(--gold)}
.tk{display:flex;gap:6px;align-items:baseline}
.dot{width:9px;height:9px;flex:none;border:1px solid #000;transform:translateY(1px)}
.tk s{color:var(--dim)}
.tk em{font-style:normal;color:var(--good)}
.pad{display:flex;justify-content:space-between;align-items:center;padding:0 6px;touch-action:none;margin-top:auto}
.dpad{position:relative;width:111px;height:111px;touch-action:none}
.dpad span{position:absolute;background:#2c313b;border:3px solid #0b0c0f;box-shadow:inset 0 -4px 0 rgba(0,0,0,.35)}
.dpad .u,.dpad .d{left:37px;width:37px;height:40px}
.dpad .u{top:0;border-bottom:none}
.dpad .d{bottom:0;border-top:none}
.dpad .l,.dpad .r{top:37px;height:37px;width:40px}
.dpad .l{left:0;border-right:none}
.dpad .r{right:0;border-left:none}
.dpad i{position:absolute;left:37px;top:37px;width:37px;height:37px;background:#2c313b;border:0}
.dpad[data-dir="up"] .u,.dpad[data-dir="down"] .d,.dpad[data-dir="left"] .l,.dpad[data-dir="right"] .r{background:var(--accent)}
.stick{position:relative;width:108px;height:108px;border-radius:50%;background:#20242c;border:3px solid #0b0c0f;box-shadow:inset 0 0 0 5px #2c313b;touch-action:none;flex:none}
.stick .ring{position:absolute;inset:22px;border-radius:50%;border:2px dashed #3a404c;pointer-events:none}
.knob{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;background:#3a404c;border:3px solid #0b0c0f;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.08);transition:transform .12s ease-out;pointer-events:none}
.stick.active .knob{background:var(--accent);transition:none}
.ab{display:flex;gap:16px;align-items:center;transform:rotate(-14deg)}
.btn{all:unset;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;font-family:var(--pix);font-size:15px;border:3px solid #0b0c0f;box-shadow:inset 0 -5px 0 rgba(0,0,0,.35);touch-action:none;cursor:pointer}
.btn.a{background:var(--bad);color:var(--ink);margin-top:-20px}
.btn.b{background:#3a404c;color:var(--ink);margin-top:20px}
.btn:active,.btn.on{filter:brightness(1.25)}
.breakmode .tray{visibility:hidden}
.keys{margin:0;color:var(--dim);font-size:12px;text-align:center}
@media (hover:hover) and (pointer:fine){ .pad{display:none} }
@media (hover:none),(pointer:coarse){ .keys{display:none} }
@media (max-width:420px){ h1{font-size:12px} .stock{gap:3px 6px} }
@media (prefers-reduced-motion:reduce){ .more{animation:none} }
.msgbar{position:absolute;left:4px;right:4px;bottom:4px;display:flex;gap:4px;align-items:flex-end;pointer-events:none}
.breakmode .msgbar{bottom:auto;top:12%}
.goalbar{position:absolute;right:4px;top:calc(8.4% + 4px);display:flex;gap:5px;z-index:2}
.goalbar button{all:unset;cursor:pointer;font-family:var(--pix);font-size:9px;padding:7px 9px;background:#4fc47f;color:#0b0c0f;border:2px solid #0b0c0f;box-shadow:2px 2px 0 #0b0c0f;animation:pop .25s steps(3)}
.goalbar button.pow{background:#f2c14e;color:#d6453d}
.goalbar button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.msgbar.top{bottom:auto;top:calc(8.4% + 4px)}
.msgbar .toast,.msgbar .callout{position:static;max-width:none;flex:1;min-width:0;overflow:hidden;margin:0;box-shadow:none}
.msgbar .toast{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;font-size:11px;line-height:1.25;background:rgba(11,12,15,.86);border:1px solid #0b0c0f;border-left:4px solid var(--accent);padding:3px 7px}
.msgbar .toast.bad{border-left-color:var(--bad)}
.msgbar .toast.good{border-left-color:var(--good)}
.msgbar .callout{font-size:11px;padding:3px 7px;border-width:2px;max-height:4.4em}
.msgbar .callout::after{display:none}
.msgbar .callout:not([hidden])~.toast{display:none}
.msgbar .hint{position:static;align-self:flex-end;flex:none;font-size:8px;padding:4px 6px;margin-left:auto;background:rgba(11,12,15,.86)}
.pow{width:min(32%,130px);aspect-ratio:1;flex:none;background:#d6453d;display:grid;place-items:center;
  clip-path:polygon(50% 0,61% 20%,84% 6%,79% 30%,100% 38%,82% 54%,96% 78%,71% 73%,63% 100%,49% 80%,32% 98%,28% 74%,4% 84%,17% 58%,0 40%,21% 32%,12% 7%,37% 20%);
  animation:powIn .55s cubic-bezier(.2,1.6,.4,1)}
.pow-in{width:84%;height:84%;background:#f2c14e;display:grid;place-items:center;clip-path:inherit}
.pow span{font-family:var(--pix);font-size:clamp(18px,7vw,34px);color:#d6453d;transform:rotate(-12deg);text-shadow:3px 3px 0 #0b0c0f}
@keyframes powIn{from{transform:scale(0) rotate(-40deg)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.pow{animation:none}}
</style>

</head>
<body>
<main class="wrap">
  <div class="hud">
    <div><span class="lbl">Clock</span><b id="clock">11:00 AM</b></div>
    <div><span class="lbl">Sales</span><b id="sales">$0</b></div>
    <div><span class="lbl">Rating</span><b id="rating">—</b></div>
    <button class="sv" id="menuBtn" aria-label="Open menu">MENU</button>
  </div>

  <div class="screen" id="screen">
    <canvas id="cv" width="192" height="192"></canvas>
    <div class="msgbar" id="msgbar">
    <div class="callout" id="callout" hidden></div>
    <div class="toast" id="toast" hidden></div>
    <div class="hint" id="hint"></div>
    </div>
    <div class="goalbar" id="goalbar" hidden><button id="goPow" class="pow" hidden>BONUS</button><button id="goNext">NEXT DAY</button><button id="goParty" hidden>END PARTY</button></div>
    <div class="box" id="box" hidden></div>
    <div class="overlay" id="overlay">
      <h2>ATLAS <span>SHIFT</span></h2>
      <p>First day on the sales floor. Doors open at 11. Help every customer find what they came for and ring them up before they lose patience.</p>
      <button class="go" id="start">CLOCK IN</button>
      <button class="go alt" id="loadTitle">LOAD SAVE</button>
      <p id="best"></p>
    </div>
  </div>

  <div class="tray">
    <section class="split"><div class="col"><span class="lbl">Tickets</span><div class="tickets" id="tickets"><span class="empty">No requests yet</span></div><button class="more" id="tkMore" hidden>▼</button></div><div class="col"><span class="lbl">To do</span><div class="tickets" id="todo"><span class="empty">All caught up</span></div><button class="more" id="todoMore" hidden>▼</button></div></section>
    <section class="wide off" id="stockSec"><span class="lbl" id="stockLbl">Floor stock</span><div class="stock" id="stock"></div></section>
  </div>

  <div class="pad" id="pad">
    <div class="stick" id="stick" aria-label="Movement stick"><span class="ring"></span><div class="knob" id="knob"></div></div>
    <div class="ab"><button class="btn b" id="bB" aria-label="B button">B</button><button class="btn a" id="bA" aria-label="A button">A</button></div>
  </div>
  <p class="keys">Arrows or WASD to move · Space / E = A · B = B · M = menu</p>
</main>

<script>
(()=>{
const T=16,COLS=12,ROWS=12,W=COLS*T,H=ROWS*T;
const FLOOR_MAP=[
"WWWWWWWWWWWW",
"WBBAAVVAWKWW",
"GFFFFFFFFFFU",
"gRMCCCFFZZZW",
"DFFFFFFFFFFY",
"DFFFFJJJFFFH",
"DFFFFFFFFFFS",
"DFFFFFFFFFFS",
"DFFFFTTTFFFS",
"DFFFFFFFFFFS",
"WOONNNNNNNNW",
"PPPPPPPPPPPP"];
const STOCK_MAP=[
"QQQQQQQQQQQQ",
"QxxxxxxxxxxQ",
"Q,,,,,,,,,,Q",
"Qtt,,xxxxxxQ",
"Qss,,,,,,,,Q",
"Qls,,xxxxxxQ",
"Qls,,,,,,,,Q",
"Qls,,www,bbQ",
"Qls,,EEE,,,Q",
"Qss,,,,,,bbQ",
"Qrrz,kkqqmmQ",
"QQQQQQQQQQQQ"];
let MAP=FLOOR_MAP;
const setMap=n=>{MAP=n==='stock'?STOCK_MAP:FLOOR_MAP;};
const tileAt=(c,r)=>(r<0||c<0||c>=COLS)?'W':(r>=ROWS?'P':MAP[r][c]);

/* ---------- catalog ---------- */
const ITEMS={};
const add=(key,section,label,price,phrase)=>{ITEMS[key]={key,section,label,price,phrase};};
['8.0','8.25','8.5'].forEach(s=>add('deck-'+s,'decks',`Deck ${s}"`,s==='8.5'?75:70,`an ${s} deck`));
const BRANDS=[
  {id:'vans',name:'Vans',price:75,day:1,col:'#c0392b',col2:'#f1ede4'},
  {id:'converse',name:'Converse',price:80,day:1,col:'#f1ede4',col2:'#26282e'},
  {id:'nikesb',name:'Nike SB',price:95,day:4,col:'#2bb3a3',col2:'#1d1f24'},
  {id:'adidas',name:'Adidas',price:90,day:4,col:'#26282e',col2:'#f4f1ea'},
  {id:'nb',name:'New Balance',price:95,day:7,col:'#9aa1ad',col2:'#c0392b'},
  {id:'asics',name:'Asics',price:90,day:7,col:'#3f7fd6',col2:'#f2c14e'}];
const SHOE_SIZES=[8,9,10,11];
BRANDS.forEach(b=>SHOE_SIZES.forEach(s=>{add(`shoe-${b.id}-${s}`,'shoes',`${b.name} sz ${s}`,b.price,`${b.name} in a size ${s}`);ITEMS[`shoe-${b.id}-${s}`].brand=b.id;}));
const brandOpen=(b,lv)=>b.day<=lv;
[8,9,10,11].forEach(sz=>add('dunk-'+sz,'release',`SB Dunk sz ${sz}`,125,`SB Dunks in a size ${sz}`));
['8.0','8.25','8.5'].forEach(sz=>add('rboard-'+sz,'release',`Release deck ${sz}`,95,`the release deck in ${sz}`));
const RELEASES=[
 {name:'SB Dunk Low',short:'SB Dunks',box:'#e46aa6',hi:'#f7b6d2',dk:'#9e3d6b',shoe:'#e46aa6',acc:'#2bb3a3'},
 {name:'Busenitz Pro',short:'Busenitz',box:'#3f7fd6',hi:'#8fb8f0',dk:'#1f4fa0',shoe:'#26282e',acc:'#f4f1ea'},
 {name:'Half Cab Pro',short:'Half Cabs',box:'#d6453d',hi:'#f08a82',dk:'#8e1f2b',shoe:'#7a2a2a',acc:'#f4f1ea'},
 {name:'NB 1010 Tiago',short:'1010s',box:'#2f8f55',hi:'#7fd1a0',dk:'#1d5a35',shoe:'#9aa1ad',acc:'#2f8f55'},
 {name:'One Star Pro',short:'One Stars',box:'#26282e',hi:'#6b6f78',dk:'#111215',shoe:'#f1ede4',acc:'#f2c14e'},

function skateScore(name,pts){
  const sk=G.sk||(G.sk={score:0,combo:0,comboT:0});
  sk.combo=sk.comboT>0?sk.combo+1:1;sk.comboT=1.6;
  const got=pts*sk.combo;sk.score+=got;
  const best=readSkateBest();if(sk.score>best){try{localStorage.setItem('atlas-shift-skate',String(sk.score));}catch(_){}}
  toast(`${name} +${got}${sk.combo>1?` (x${sk.combo})`:''} · Skate ${sk.score}`,'good');blip(330,.06,'triangle',.05);
}
function endGrind(p){p.grinding=false;skateScore((p.slide||'50-50')+(p.swaps?` (${p.swaps+1} slides)`:'')+` ${p.grindT.toFixed(1)}s`,Math.round(25+p.grindT*70+(p.swaps||0)*25));p.swaps=0;}
function land(p){
  const under=tileUnder(p),flip=p.flip,spin=p.spin||0;p.flip=null;p.spin=0;
  const sp=spin?(spin===180?'FS 180':spin===360?'360':'540'):'';
  const trick=sp&&flip?`${sp} ${flip.toLowerCase()}`:sp||flip||'';
  if(under==='l'){p.grinding=true;p.grindT=0;p.swaps=0;p.slide=pick(['50-50','5-0','Boardslide','Smith grind']);if(trick)skateScore(`${trick} into ${p.slide.toLowerCase()}`,70+spin/6);else blip(330,.2,'sawtooth',.02);return;}
  let name,pts=(flip?45:0)+spin/6;
  if(p.launch==='qp'){name=trick?trick+' out of the ramp':pick(QP_TRICKS);pts+=60;}
  else if(p.overLedge){name=(trick||'Ollie')+' over the box';pts+=30;}
  else{name=trick||'Ollie';pts+=10;}
  skateScore(name,Math.round(pts));
}

function updatePlayer(dt){
  const p=G.player;let dx=hold.right-hold.left,dy=hold.down-hold.up,sm=1;
  if(stick.on){const m=Math.hypot(stick.x,stick.y);if(m>.2){dx=stick.x;dy=stick.y;sm=m>.85?1:Math.max(.45,m);}else{dx=0;dy=0;}}
  if(p.emote){if(dx||dy||p.skate)p.emote=null;else{p.emote.t-=dt;p.moving=false;if(p.emote.t<=0)p.emote=null;return;}}
  const onSkate=(G.map==='stock'&&SKATE.has(tileUnder(p))&&p.stockBoard)||(p.walkSkate&&G.map==='floor'&&tileUnder(p)==='P');
  if(G.sk&&G.sk.comboT>0)G.sk.comboT-=dt;
  if(onSkate||p.air>0){
    if(!p.skate){p.skate=true;p.vx=p.vx||0;p.vy=p.vy||0;}
    if(dx||dy){const len=Math.hypot(dx,dy);p.vx+=(dx/len*100-p.vx)*Math.min(1,dt*4);p.vy+=(dy/len*100-p.vy)*Math.min(1,dt*4);
      if(hold[lastDir])p.dir=lastDir;else p.dir=dx?(dx>0?'right':'left'):(dy>0?'down':'up');}
    else{p.vx*=1-Math.min(1,dt*1.1);p.vy*=1-Math.min(1,dt*1.1);}
    const under=tileUnder(p);
    if(p.air<=0&&under==='r'&&p.vy>25){if(p.grinding)endGrind(p);launch(p,.75,'qp');p.flip=null;p.vy=-Math.abs(p.vy)*.95;}
    if(p.air<=0&&under==='t')p.vy+=140*dt;
    if(p.air<=0&&under==='r')p.vy-=140*dt;
    if(p.air<=0&&under==='t'&&p.vy<-25){if(p.grinding)endGrind(p);launch(p,.75,'qp');p.flip=null;p.vy=Math.abs(p.vy)*.95;}
    const mx=p.vx*dt,my=p.vy*dt;
    const boxAt=(x,y)=>tileAt(Math.floor(x/T),Math.floor((y-3)/T))==='l';
    const hitBox=(x,y)=>p.air<=0&&!p.grinding&&boxAt(x,y);
    if(!blocked(p.x+mx,p.y)&&!hitBox(p.x+mx,p.y))p.x+=mx;else p.vx*=-.3;
    if(!blocked(p.x,p.y+my)&&!hitBox(p.x,p.y+my))p.y+=my;else p.vy*=-.3;
    if(p.grinding){p.grindT+=dt;if(!boxAt(p.x,p.y))endGrind(p);}
    if(p.air>0){if(tileUnder(p)==='l')p.overLedge=true;p.air-=dt;if(p.air<=0){p.air=0;land(p);}}
    p.moving=Math.hypot(p.vx,p.vy)>8;
    if(!(SKATE.has(tileUnder(p))&&G.map==='stock')&&!(p.walkSkate&&G.map==='floor'&&tileUnder(p)==='P')&&p.air<=0){if(p.grinding)endGrind(p);p.skate=false;p.walkSkate=false;p.stockBoard=false;p.vx=p.vy=0;}
    return;
  }
  p.skate=false;
  p.moving=!!(dx||dy);
  if(p.moving){
    if(hold[lastDir])p.dir=lastDir;else p.dir=dx?(dx>0?'right':'left'):(dy>0?'down':'up');
    const len=Math.hypot(dx,dy),sp=62*dt*sm;dx=dx/len*sp;dy=dy/len*sp;
    if(!blocked(p.x+dx,p.y))p.x+=dx;
    if(!blocked(p.x,p.y+dy))p.y+=dy;
    p.ft+=dt;if(p.ft>.14){p.ft=0;p.frame++;}
  }
}
function target(){
  const p=G.player,[fx,fy]=DIRV[p.dir],cx=p.x,cy=p.y-4;
  if(G.map==='floor'){const ptc=Math.floor(p.x/T),ptr=Math.floor((p.y-3)/T);
    for(const c of G.customers)if(c.state==='wait'&&c.talk&&!c.path.length&&c.talk[0]===ptc&&c.talk[1]===ptr)return {kind:'customer',c};
    const ftc=Math.floor((cx+fx*10)/T),ftr=Math.floor((cy+fy*10)/T);
    const ms=(G.messes||[]).find(m=>(m.c===ptc&&m.r===ptr)||(m.c===ftc&&m.r===ftr));
    if(ms)return {kind:'mess',m:ms};
    if(coffeeOn()&&ftc===10&&ftr===9)return {kind:'coffee'};
    if((G.dbox||(G.delivery&&G.delivery.boxes.length))&&p.dir!=='up'&&(ptc===9||ptc===10)&&ptr===2){if(!G.delivery)G.delivery={boxes:[],c:10,r:2};return {kind:'pile'};}}
  if(G.map==='floor'&&p.dir!=='up'&&p.y<3*T+6&&p.y>T&&p.x<3*T+4){const pc=Math.floor(p.x/T);
    if(p.dir==='left'&&pc<=1)return {kind:'tile',ch:'g',tc:0,tr:3};
    if(pc===2&&p.dir==='down'&&(G.release||(G.web&&G.web.open.length)))return {kind:'tile',ch:'M',tc:2,tr:3};
    if(pc<=2)return {kind:'tile',ch:'R',tc:1,tr:3};}
  if(G.co&&G.co.vis&&G.co.map===G.map){const c=G.co,vx=c.x-cx,vy=(c.y-4)-cy,dist=Math.hypot(vx,vy),reach=c.dis==='skate'?40:22;
    if(dist<reach&&(vx*fx+vy*fy>2||dist<10))return {kind:'co'};}
  let best=null,bd=99;
  for(const c of (G.map==='floor'?G.customers:[])){
    if(!['wait','queue','idle','in','steal'].includes(c.state)||c.y>=rowY(10)||c.x<4||c.x>W-4)continue;
    const vx=c.x-cx,vy=(c.y-4)-cy,dot=vx*fx+vy*fy,dist=Math.hypot(vx,vy);
    if(dot>2&&dist<20&&dist<bd){bd=dist;best=c;}
  }
  if(best)return {kind:'customer',c:best};
  if(G.map==='floor'){const own=[Math.floor(p.x/T),Math.floor((p.y-3)/T)];for(const d of [6,10,14,18]){const qx=cx+fx*d,qy=cy+fy*d;if(pileAt(qx,qy)&&!(Math.floor(qx/T)===own[0]&&Math.floor(qy/T)===own[1]))return {kind:'pile'};}}
  if(G.map==='floor')for(const d of [6,10,14]){const tb=inTable(cx+fx*d,cy+fy*d);if(tb)return {kind:'tile',ch:tb.ch,tc:Math.max(5,Math.min(7,Math.floor((cx+fx*d)/T))),tr:tb.row};}
  for(const d of [9,15]){
    const tc=Math.floor((cx+fx*d)/T),tr=Math.floor((cy+fy*d)/T),ch=tileAt(tc,tr);
    if(walkable(ch))continue;
    return {kind:'tile',ch,tc,tr};
  }
  return null;
}
function hintFor(t){
  if(!t)return '';
  if(t.kind==='customer')return 'A · Talk';
  if(t.kind==='mess')return 'A · Clean up';
  if(t.kind==='coffee')return 'A · Coffee & doughnuts';
  if(t.kind==='co')return 'A · Talk to Danny';
  if(t.kind==='pile')return G.dbox?'A · Set box back on pile':`A · Delivery (${G.delivery.boxes.length})`;
  const ch=t.ch;
  if(TILE_SECTION[ch])return 'A · '+SECTIONS[TILE_SECTION[ch]];
  if(ch==='R')return 'A · Register';
  if(ch==='B')return t.tc===1?'A · Music & web orders':'A · Grip bench';
  if(ch==='K')return 'A · Stock room';
  if(ch==='M')return G.release?'A · Release boxes':G.web&&G.web.open.length?'A · Box web order':'A · Desk';
  if(ch==='g')return G.phone&&G.phone.ring>0?'A · Answer phone':'A · Phone';
  if(ch==='V')return 'A · TV';
  if(ch==='U')return 'A · Fitting room';
  if(ch==='Z')return 'A · Gallery wall';
  if(ch==='N')return 'A · Window';
  if(STATIONS[ch]&&G.map==='stock'){const sp=stockSpot(t.tc,t.tr);if(!sp&&ch==='x')return 'A · Empty shelf';return 'A · '+(sp?dName(sp.key)+(sp.sec==='shoes'?'':' stock'):STATION_NAMES[ch]);}
  const F={z:'Fridge',w:G.level>=3?'Web orders':'Packing table',E:'Stairs up',m:'Photo station',f:'Fan',u:'Trash can',p:'Support post'};
  if(F[ch])return 'A · '+F[ch];
  return '';
}

function advanceLine(){G.release.line.forEach((id,i)=>{const c=G.customers.find(x=>x.id===id);if(c)c.path=[[colX(3+i),rowY(11)]];});}
function breakLine(sold){
  const RL=G.release;if(!RL.line.length)return;
  if(sold){RL.sold=true;toast(`${REL.short} are SOLD OUT. The line breaks up.`,'bad');}
  RL.line.forEach(id=>{const c=G.customers.find(x=>x.id===id);if(c){c.chair=false;leave(c,null);}});RL.line=[];
}
function admitLine(){
  const RL=G.release,id=RL.line.shift(),c=G.customers.find(x=>x.id===id);if(!c)return;
  const left=()=>Object.values(RL.claim).reduce((a,b)=>a+b,0);
  if(left()<=0){RL.line.unshift(id);return breakLine(true);}
  if(RL.claim[c.size]<=0){
    const other=Object.keys(RL.claim).filter(z=>RL.claim[z]>0);
    if(Math.random()<.5){c.size=pick(other);c.swapped=true;}
    else{c.chair=false;leave(c,'x');toast(`${nameOf(c)}: "No ${c.size}s left? Man, I camped out for this."`,'bad');advanceLine();return;}
  }
  RL.claim[c.size]--;c.req=[relKey(c.size)];c.got=[];c.chair=false;c.patience=100;
  G.queue.push(c);c.state='queue';c.path=route(c.x,c.y,slotX(G.queue.length-1),rowY(4));
  sfx.door();advanceLine();
